# apphosting.yaml (Proyecto Cliente)
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

build:
  installCommand: npm install
  buildCommand: npm run build

env:
  - variable: BOLD_API_KEY
    value: VEW5VyjrdTMVhZaWlPPCvEQChyhShW9SVzWfCrtPz8g
    availability:
      - BUILD
      - RUNTIME

  - variable: BOLD_INTEGRITY_SECRET
    secret: BOLD_INTEGRITY_SECRET
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://mirror-maison--maison-mirror-1ab5b.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # Credenciales para enviar notificaciones push a los administradores
  - variable: FIREBASE_CLIENT_EMAIL
    value: "firebase-adminsdk-fbsvc@maison-mirror-1ab5b.iam.gserviceaccount.com"
    availability:
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME